version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
